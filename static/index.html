<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patent Search Tester</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1c2430; --muted: #5d6878; --border: #dde2e9;
    --accent: #2f5bd3; --accent-ink: #fff; --ok: #1f7a4d; --ok-bg: #e3f4ea;
    --bad: #b3261e; --bad-bg: #fbe9e7; --chip: #eef1f6; --code-bg: #0f1621; --code-ink: #d6e2f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141b; --panel: #171d26; --text: #e4e9f0; --muted: #95a1b2; --border: #2a3341;
      --accent: #6f93ff; --accent-ink: #0b1020; --ok: #6fd3a0; --ok-bg: #16352a;
      --bad: #ff8a80; --bad-bg: #3a1b1b; --chip: #232c39; --code-bg: #0b1017; --code-ink: #c9d6e6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
           padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .badge { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .row { display: flex; gap: 10px; }
  .row > input { flex: 1; }
  input, select, button { font: inherit; color: inherit; }
  input, select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); min-width: 0; }
  button { padding: 8px 16px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .status { margin: 18px 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
  .error { background: var(--bad-bg); color: var(--bad); padding: 10px 14px; border-radius: 8px; margin-top: 14px; }
  .card { display: flex; gap: 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .card img { width: 90px; height: 110px; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid var(--border); flex-shrink: 0; }
  .card .body { min-width: 0; flex: 1; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card h3 a { color: var(--accent); text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .meta b { color: var(--text); font-weight: 600; }
  .snippet { margin: 8px 0; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
  .chip.active { background: var(--ok-bg); color: var(--ok); }
  .chips a { font-size: 13px; color: var(--accent); margin-right: 8px; }
  .pager { display: flex; gap: 8px; align-items: center; }
  .raw { margin-top: 20px; }
  .raw .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  pre { background: var(--code-bg); color: var(--code-ink); padding: 14px; border-radius: 8px; overflow: auto; max-height: 600px; font-size: 12.5px; }
  .hidden { display: none; }
  @media (max-width: 600px) {
    .row { flex-direction: column; }
    .card img { width: 64px; height: 80px; }
  }
</style>
</head>
<body>
<header>
  <h1>Patent Search Tester <small>SerpApi · google_patents</small></h1>
  <span><a href="/how-it-works" style="font-size:14px;color:var(--accent);text-decoration:none;margin-right:10px">How it works</a><a href="/idea" style="font-size:14px;color:var(--accent);text-decoration:none;margin-right:10px">Idea search →</a><span id="keyBadge" class="badge">Checking API key…</span></span>
</header>

<main>
  <form id="form" class="panel">
    <div class="row">
      <input id="q" name="q" placeholder='Keywords, e.g. (lithium battery) OR (solid state electrolyte)' autofocus>
      <button type="submit" class="primary" id="searchBtn">Search</button>
    </div>
    <details>
      <summary>Advanced filters</summary>
      <div class="grid">
        <label>Inventor <input name="inventor" placeholder="e.g. Elon Musk"></label>
        <label>Assignee <input name="assignee" placeholder="e.g. Tesla"></label>
        <label>Country <input name="country" placeholder="e.g. US,WO,EP"></label>
        <label>Language <input name="language" placeholder="e.g. ENGLISH,GERMAN"></label>
        <label>Date type
          <select id="dateType">
            <option value="priority">Priority</option>
            <option value="filing">Filing</option>
            <option value="publication">Publication</option>
          </select>
        </label>
        <label>After <input type="date" id="afterDate"></label>
        <label>Before <input type="date" id="beforeDate"></label>
        <label>Status
          <select name="status"><option value="">Any</option><option value="GRANT">Grant</option><option value="APPLICATION">Application</option></select>
        </label>
        <label>Type
          <select name="type"><option value="">Any</option><option value="PATENT">Patent</option><option value="DESIGN">Design</option></select>
        </label>
        <label>Litigation
          <select name="litigation"><option value="">Any</option><option value="YES">Has litigation</option><option value="NO">No litigation</option></select>
        </label>
        <label>Sort
          <select name="sort"><option value="">Relevance</option><option value="new">Newest</option><option value="old">Oldest</option></select>
        </label>
        <label>Results per page
          <select name="num"><option>10</option><option>20</option><option>50</option><option>100</option></select>
        </label>
        <label>Group by
          <select name="dups"><option value="">Family</option><option value="language">Publication</option></select>
        </label>
        <label class="check"><input type="checkbox" name="scholar"> Include Google Scholar</label>
      </div>
      <div class="hint">Keyword syntax: separate terms with <code>;</code> for AND across fields, use <code>OR</code> / parentheses, and CPC codes like <code>(A47J)</code>. Each search uses 1 SerpApi credit.</div>
    </details>
  </form>

  <div id="error" class="error hidden"></div>

  <div id="statusBar" class="status hidden">
    <span id="statusText"></span>
    <div class="pager">
      <button id="prevBtn" type="button">← Prev</button>
      <span id="pageLabel"></span>
      <button id="nextBtn" type="button">Next →</button>
    </div>
  </div>

  <div id="results"></div>

  <section id="rawSection" class="raw hidden">
    <details>
      <summary>Raw SerpApi JSON</summary>
      <div class="bar" style="margin-top:8px">
        <span class="hint" id="rawInfo"></span>
        <button type="button" id="downloadBtn">Download JSON</button>
      </div>
      <pre id="raw"></pre>
    </details>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let currentPage = 1;
let lastRaw = null;
let lastTotal = 0;

async function api(path) {
  const res = await fetch(path);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = body.detail;
    throw new Error(typeof d === "string" ? d : JSON.stringify(d ?? body) || `HTTP ${res.status}`);
  }
  return body;
}

async function loadAccount() {
  const badge = $("keyBadge");
  try {
    const a = await api("/api/account");
    badge.className = "badge ok";
    badge.textContent = `Key OK · ${a.plan_name ?? "plan"} · ${a.total_searches_left ?? "?"} searches left`;
  } catch (e) {
    badge.className = "badge bad";
    badge.textContent = "Key problem";
    badge.title = e.message;
  }
}

function buildParams(page) {
  const fd = new FormData($("form"));
  const p = new URLSearchParams();
  for (const [k, v] of fd.entries()) {
    if (k === "scholar") p.set("scholar", "true");
    else if (String(v).trim()) p.set(k, String(v).trim());
  }
  const type = $("dateType").value;
  const toSerp = (d) => `${type}:${d.replaceAll("-", "")}`;
  if ($("afterDate").value) p.set("after", toSerp($("afterDate").value));
  if ($("beforeDate").value) p.set("before", toSerp($("beforeDate").value));
  p.set("page", page);
  return p;
}

function renderCard(r) {
  const people = [
    r.assignee && `<span>Assignee: <b>${esc(r.assignee)}</b></span>`,
    r.inventor && `<span>Inventor: <b>${esc(r.inventor)}</b></span>`,
  ].filter(Boolean).join("");
  const dates = [
    ["Priority", r.priority_date], ["Filed", r.filing_date],
    ["Published", r.publication_date], ["Granted", r.grant_date],
  ].filter(([, v]) => v).map(([k, v]) => `<span>${k}: <b>${esc(v)}</b></span>`).join("");
  const statuses = Object.entries(r.country_status || {})
    .map(([c, s]) => `<span class="chip ${s === "ACTIVE" ? "active" : ""}" title="${esc(s)}">${esc(c)} · ${esc(s)}</span>`).join("");
  const links = [
    r.pdf && `<a href="${esc(r.pdf)}" target="_blank" rel="noopener">PDF</a>`,
  ].filter(Boolean).join("");
  const img = r.thumbnail ? `<img src="${esc(r.thumbnail)}" alt="" loading="lazy">` : "";
  const title = r.patent_link
    ? `<a href="${esc(r.patent_link)}" target="_blank" rel="noopener">${esc(r.title || r.publication_number)}</a>`
    : esc(r.title || r.publication_number);

  return `<article class="card">${img}<div class="body">
    <h3>${title}</h3>
    <div class="meta"><span><b>${esc(r.publication_number || r.patent_id)}</b></span>${r.language ? `<span>${esc(r.language)}</span>` : ""}${people}</div>
    <div class="meta">${dates}</div>
    ${r.snippet ? `<p class="snippet">${esc(r.snippet)}</p>` : ""}
    <div class="chips">${links}${statuses}</div>
  </div></article>`;
}

async function runSearch(page = 1) {
  const params = buildParams(page);
  $("error").classList.add("hidden");
  $("searchBtn").disabled = $("prevBtn").disabled = $("nextBtn").disabled = true;
  $("searchBtn").textContent = "Searching…";
  try {
    const data = await api(`/api/search?${params}`);
    const s = data.summary;
    currentPage = s.page;
    lastRaw = data.raw;
    lastTotal = s.total_results || 0;

    const totalPages = Math.max(1, Math.ceil(lastTotal / s.num));
    $("statusText").textContent =
      `${lastTotal.toLocaleString()} results · ${data.results.length} shown · ${s.total_time_taken ?? "?"}s · search id ${s.search_id ?? "-"}`;
    $("pageLabel").textContent = `Page ${currentPage} of ${totalPages.toLocaleString()}`;
    $("statusBar").classList.remove("hidden");
    $("prevBtn").disabled = currentPage <= 1;
    $("nextBtn").disabled = currentPage >= totalPages || data.results.length === 0;

    $("results").innerHTML = data.results.length
      ? data.results.map(renderCard).join("")
      : `<div class="panel">${esc(s.error || "No results.")}</div>`;

    $("raw").textContent = JSON.stringify(data.raw, null, 2);
    $("rawInfo").textContent = `${Object.keys(data.raw).length} top-level keys: ${Object.keys(data.raw).join(", ")}`;
    $("rawSection").classList.remove("hidden");
    loadAccount(); // refresh remaining credits
  } catch (e) {
    $("error").textContent = e.message;
    $("error").classList.remove("hidden");
  } finally {
    $("searchBtn").disabled = false;
    $("searchBtn").textContent = "Search";
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); runSearch(1); });
$("prevBtn").addEventListener("click", () => runSearch(currentPage - 1));
$("nextBtn").addEventListener("click", () => runSearch(currentPage + 1));
$("downloadBtn").addEventListener("click", () => {
  if (!lastRaw) return;
  const blob = new Blob([JSON.stringify(lastRaw, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `serpapi-patents-${lastRaw.search_metadata?.id ?? "result"}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});

loadAccount();
</script>
</body>
</html>
